name: contribution graph

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#CCE624&color_dots=#161B22,#3A4A08,#68770E,#B1C917,#CCE624
            dist/snake-light.svg?palette=github-light&color_snake=#050403&color_dots=#EBEDF0,#EAF5A3,#DBED63,#D3F205,#CCE624

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
